<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Payroll</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14231e;--muted:#5b6b66;--line:#d9e3df;--line2:#eef3f1;--brand:#016351;--brand2:#e6f3ef;--brand-ink:#fff;--danger:#b42318;--danger2:#fde8e6;--warn:#9a5b00;--warn2:#fff4dc;--ok:#13795b;--ok2:#dcf3e8;--side:#0f2a24;--side-ink:#cfe3dc;--focus:0 0 0 3px rgba(1,99,81,.25);--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0 0 .5rem;line-height:1.25}h1{font-size:1.35rem}h2{font-size:1.1rem}h3{font-size:.98rem}
.side{width:236px;flex:0 0 236px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#18a383;display:grid;place-items:center;font-weight:800;color:#06221c;letter-spacing:-.5px}
.brand b{display:block;font-size:1rem}.brand small{display:block;color:#8fb3a8;font-size:.75rem;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{list-style:none;margin:0;padding:6px 8px 16px}
.nav .sec{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#7fa196;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#18a383;color:#06221c;font-weight:700}
.nav a.sub{padding-left:28px;font-size:.92rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:auto}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:1.15rem;flex:1;min-width:0}
.top .st{font-size:.8rem;color:var(--muted)}
.menu{display:none;border:0;background:none;font-size:1.3rem;padding:2px 6px;cursor:pointer}
#view{padding:20px 22px 60px;max-width:1500px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row.mid{align-items:center}
.sp{flex:1}
.fg{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fg label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fg small{color:var(--muted);font-size:.76rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;box-shadow:var(--focus);border-color:var(--brand)}
input[type=checkbox]{width:auto}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--brand)}
.btn.d{background:#fff;color:var(--danger);border-color:#e7b4ae}
.btn.s{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:.85rem;margin:.3rem 0 .6rem}
.chip{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.74rem;font-weight:700;background:var(--line2);color:var(--muted)}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.warn{background:var(--warn2);color:var(--warn)}.chip.bad{background:var(--danger2);color:var(--danger)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--warn2);color:#5c3a00;border:1px solid #f1d49b}
.alert.info{background:var(--brand2);color:#0b3d32;border-color:#bfe0d6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi>span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:1.3rem;margin:.15rem 0}.kpi small{color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;white-space:nowrap}
table.t thead th{position:sticky;top:0;background:#f7faf9;z-index:2;font-size:.76rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
table.t tfoot td{position:sticky;bottom:0;background:#f7faf9;font-weight:700;border-top:1px solid var(--line);z-index:2}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.off td{opacity:.55}
table.t tr.g td{background:#f2f8f6;font-weight:700}
table.t tbody tr:hover td{background:#fafcfb}
table.t td.wrap{white-space:normal;min-width:180px}
.grid td,.grid th{padding:3px 4px}
.grid th{text-align:center!important;white-space:normal!important;min-width:76px;line-height:1.15}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:210px;max-width:260px;white-space:normal;text-align:left!important}
.grid thead th:first-child{z-index:3;background:#f7faf9}
.grid tfoot td:first-child{z-index:3;background:#f7faf9}
.grid input{width:92px;text-align:right;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.grid input.days{width:62px}
.grid input.man{background:#fff8e6;border-color:#e8c46a}
.grid input.auto{color:#3f6a5e;background:#f7fbf9}
.grid td.calc{color:#33433e;text-align:right;font-variant-numeric:tabular-nums;padding-right:8px}
.grid td.net{font-weight:700}
.grid .neg{color:var(--danger)}
.grid .nm b{display:block}.grid .nm small{color:var(--muted)}
.grid th.grpE{background:#eef8f4}.grid th.grpD{background:#fbf1ef}
.grid .tm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer;margin-left:4px}
.grid .tm.on{background:var(--brand2);border-color:#9fd2c4}
.grid.locked input{background:transparent;border-color:transparent;pointer-events:none;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs a,.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:600;cursor:pointer}
.tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ov{position:fixed;inset:0;background:rgba(10,25,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
.md{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h2{margin-top:0}
.md .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
#toasts{position:fixed;left:252px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#toasts .toast{pointer-events:auto;cursor:pointer}
.toast{background:#13241f;color:#fff;border-radius:10px;padding:10px 14px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--danger)}
.pv{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.hl{display:grid;gap:6px}
.hl .h{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) 70px 70px auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line2);border-radius:8px}
.hl .h small{color:var(--muted)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.out div{background:var(--brand2);border-radius:8px;padding:8px 10px}.out span{display:block;font-size:.75rem;color:#2c5348}.out b{font-size:1.05rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:var(--line2);border-radius:4px;padding:0 4px}
@media(max-width:900px){#toasts{left:12px;right:12px}.side{position:fixed;left:-250px;z-index:90;transition:left .2s}.side.open{left:0}.menu{display:block}#view{padding:14px}}
@media print{body{display:block}.side,.top{display:none}}
</style>
</head>
<body>
<aside class="side" id="side">
 <div class="brand"><div class="logo">AJ</div><div><b>AJ Payroll</b><small id="brandSub">Offline payroll</small></div></div>
 <ul class="nav" id="nav"></ul>
</aside>
<div class="main">
 <header class="top"><button class="menu" id="menuBtn" aria-label="Menu">☰</button><h1 id="ttl">AJ Payroll</h1><span class="st" id="saveSt"></span><button class="btn o s" id="bkBtn" title="Download a backup of all payroll data">Backup</button></header>
 <div id="view"></div>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
// =====================================================================================
// AJ Payroll – standalone offline payroll (Philippines). All money is kept in centavos.
// =====================================================================================
const KEY='ajpay_v1',VER='1.0';
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const c100=v=>{const n=parseFloat(String(v==null?'':v).replace(/[,₱\s]/g,''));return Number.isFinite(n)?Math.round(n*100):0};
const n2=c=>{c=Math.round(c||0);const s=(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return c<0?'('+s+')':s};
const m2=c=>c?n2(c):'–';
const pe=c=>c?(c/100).toFixed(2):'';            // value for an <input>
const p2=c=>((c||0)/100).toFixed(2);            // value for CSV
const r4=n=>Math.round(n*10000)/10000;
const fN=n=>{n=r4(n||0);return n?String(n):'–'};
const pos=v=>Math.max(0,v);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const today=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const cutoff=(y,m,q)=>[ymd(y,m,q===1?1:16),ymd(y,m,q===1?15:lastDay(y,m))];
const perLabel=(y,m,q)=>MN[m-1]+' '+(q===1?'1–15':'16–'+lastDay(y,m))+', '+y;
const perShort=(y,m,q)=>MN[m-1].slice(0,3)+' '+(q===1?'1–15':'16–'+lastDay(y,m))+' '+y;
const pkey=(y,m,q)=>y*100+m*4+q;
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const fdw=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const cmp=(a,b)=>String(a==null?'':a).localeCompare(String(b==null?'':b),undefined,{numeric:true,sensitivity:'base'});
const slug=s=>String(s||'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'file';

// ---------------------------------------------------------------- built-in rules (editable in Settings)
const DEF_RATES={sss:{ee:5,er:10,min:5000,max:35000,step:500,ecLow:10,ecHigh:30,ecAt:15000},ph:{rate:5,floor:10000,ceil:100000},hdmf:{eeLow:1,ee:2,er:2,low:1500,cap:10000},asOf:'2026'};
const DEF_PREM={ot:125,nd:10,rd:130,rdot:169,sp:130,sprd:150,spot:169,sprdot:195,rh:200,rhrd:260,rhot:260,rhrdot:338};
const PREM_LBL={ot:'Overtime, ordinary day',nd:'Night differential (added on top)',rd:'Rest day work',rdot:'Rest day overtime',sp:'Special non-working day worked',sprd:'Special day that is also a rest day',spot:'Special day overtime',sprdot:'Special day + rest day overtime',rh:'Regular holiday worked',rhrd:'Regular holiday that is also a rest day',rhot:'Regular holiday overtime',rhrdot:'Regular holiday + rest day overtime'};
// BIR withholding tax on compensation, semi-monthly (RR 11-2018 Annex E, rates from Jan 1, 2023): [over, fixed tax, % of excess]
const WT_SEMI=[[10417,0,15],[16667,937.5,20],[33333,4270.7,25],[83333,16770.7,30],[333333,91770.7,35]];
// Annual graduated income tax (TRAIN, from 2023)
const WT_YEAR=[[250000,0,15],[400000,22500,20],[800000,102500,25],[2000000,402500,30],[8000000,2202500,35]];
const bracket=(t,x)=>{let v=0;for(const r of t)if(x>r[0])v=r[1]+(x-r[0])*r[2]/100;return v};
const wtaxSemi=c=>Math.round(bracket(WT_SEMI,c/100)*100);
const taxYear=c=>Math.round(bracket(WT_YEAR,c/100)*100);
const STATUSES=['Regular','Probationary','Contractual','Casual','Project','Seasonal'];
const DEF_ITEMS=[
 {id:'m13',name:'13th Month Pay',kind:'E',tax:'B',fixed:1},
 {id:'sil',name:'Service Incentive Leave Pay',kind:'E',tax:'T'},
 {id:'com',name:'Commission',kind:'E',tax:'T',sss:1},
 {id:'inc',name:'Incentive / Bonus',kind:'E',tax:'B'},
 {id:'rice',name:'Rice Subsidy',kind:'E',tax:'DM',limit:200000,per:'M'},
 {id:'adj',name:'Salary Adjustment',kind:'E',tax:'T',sss:1},
 {id:'ntx',name:'Other Non-taxable Pay (reimbursement)',kind:'E',tax:'N'},
 {id:'uni',name:'Uniform',kind:'D'},
 {id:'odd',name:'Other Deduction',kind:'D'}];
const DEF_DTYPES=['Cash Advance','Credit','Credit Balance','SSS Loan','Pag-IBIG Loan'];
const TAXK={T:'Taxable',N:'Non-taxable',DM:'De minimis (tax-free up to a limit)',B:'13th month & other benefits (tax-free up to ₱90,000 a year)'};

// ---------------------------------------------------------------- data
let DB=null;
function blank(){return{v:1,company:{name:''},biz:[],settings:{sched:'split',mealNT:true,annualize:true,mweRate:0,silDays:5,benCap:9000000,rates:clone(DEF_RATES),prem:clone(DEF_PREM)},
 items:clone(DEF_ITEMS),dtypes:DEF_DTYPES.map((n,i)=>({id:'d'+(i+1),name:n})),employees:[],ledger:[],runs:[],hol:{add:[],off:[]},ytd:{},meta:{created:new Date().toISOString(),lastBackup:null}}}
function migrate(d){
 const b=blank();if(!d||typeof d!=='object')return b;
 for(const k of Object.keys(b))if(d[k]==null||typeof d[k]!==typeof b[k]||Array.isArray(b[k])!==Array.isArray(d[k]))d[k]=b[k];
 d.settings=Object.assign(b.settings,d.settings);d.settings.rates=Object.assign(clone(DEF_RATES),d.settings.rates||{});d.settings.prem=Object.assign(clone(DEF_PREM),d.settings.prem||{});
 ['sss','ph','hdmf'].forEach(k=>d.settings.rates[k]=Object.assign(clone(DEF_RATES[k]),d.settings.rates[k]||{}));
 if(!d.items.some(i=>i.id==='m13'))d.items.unshift(clone(DEF_ITEMS[0]));
 d.hol=Object.assign({add:[],off:[]},d.hol);d.meta=Object.assign(b.meta,d.meta);
 d.runs.forEach(r=>r.rows.forEach(x=>{x.items=x.items||{};x.ded=x.ded||{};x.man=x.man||{};x.tm=x.tm||{}}));
 return d;
}
// storage: IndexedDB (room for many years of payroll), with a copy in localStorage while it fits
const IDB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('ajpay',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 get(k){return new Promise(res=>{try{const q=IDB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 put(k,v){return new Promise(res=>{try{const t=IDB.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}})}};
async function load(){
 let a=null,b=null;try{b=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(await IDB.open()){try{a=JSON.parse(await IDB.get(KEY)||'null')}catch(e){}}
 const t=d=>d&&d.meta&&d.meta.savedAt||'';DB=migrate(a&&b?(t(a)>=t(b)?a:b):(a||b))}
let saveT=null,dirty=false;
function save(now){dirty=true;$('#saveSt')&&($('#saveSt').textContent='Saving…');clearTimeout(saveT);
 const go=async()=>{DB.meta.savedAt=new Date().toISOString();const s=JSON.stringify(DB);let ok=false,ls=false;
  try{localStorage.setItem(KEY,s);ls=true}catch(e){try{localStorage.removeItem(KEY)}catch(x){}}
  if(IDB.db)ok=await IDB.put(KEY,s);
  if(ok||ls){dirty=false;$('#saveSt').textContent='All changes saved'}else{$('#saveSt').textContent='NOT SAVED';toast('Could not save: browser storage is full or blocked. Download a backup now (Settings › Backup & data).','bad',9000)}};
 if(now)go();else saveT=setTimeout(go,300)}
window.addEventListener('beforeunload',e=>{if(dirty)save(true)});
const S=()=>DB.settings;
const empById=id=>DB.employees.find(e=>e.id===id);
const fullName=e=>(e.last+', '+e.first+(e.mi?' '+String(e.mi).replace(/\.?$/,'.'):'')).trim();
const empCmp=(a,b)=>cmp(a.business,b.business)||cmp(a.last,b.last)||cmp(a.first,b.first);
const rowCmp=(a,b)=>cmp(a.business,b.business)||cmp(a.name,b.name);
const bizList=()=>[...new Set(DB.biz.map(b=>b.name).concat(DB.employees.map(e=>e.business)).filter(Boolean))].sort(cmp);
const bizInfo=n=>DB.biz.find(b=>b.name===n)||{name:n};
const dailyOf=e=>e.basis==='monthly'?Math.round((e.monthly||0)*12/(+e.factor||261)):(e.rate||0);
const runOf=(y,m,q)=>DB.runs.find(r=>r.year===y&&r.month===m&&r.q===q);
const itemsE=()=>DB.items.filter(i=>i.kind!=='D'&&i.active!==false),itemsD=()=>DB.items.filter(i=>i.kind==='D'&&i.active!==false);
const isMwe=(e,r)=>!!(e&&e.mwe)||(S().mweRate>0&&(r?r.daily:dailyOf(e||{}))>0&&(r?r.daily:dailyOf(e||{}))<=S().mweRate);

// ---------------------------------------------------------------- holidays (RA 9492 and yearly proclamations; edit in Settings)
const HC={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31);return new Date(y,mo-1,((h+l-7*m+114)%31)+1)}
function baseHol(y){if(HC[y])return HC[y];const o=[],R='R',SP='S',add=(k,n,t)=>o.push({date:k,name:n,type:t}),fx=(m,d,n,t)=>add(ymd(y,m,d),n,t),E=easter(y),eo=n=>{const d=new Date(E.getFullYear(),E.getMonth(),E.getDate()+n);return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
 fx(1,1,"New Year's Day",R);add(eo(-3),'Maundy Thursday',R);add(eo(-2),'Good Friday',R);add(eo(-1),'Black Saturday',SP);fx(4,9,'Araw ng Kagitingan',R);fx(5,1,'Labor Day',R);fx(6,12,'Independence Day',R);fx(8,21,'Ninoy Aquino Day',SP);
 let d=new Date(y,7,31);while(d.getDay()!==1)d.setDate(d.getDate()-1);fx(8,d.getDate(),'National Heroes Day',R);
 fx(11,1,"All Saints' Day",SP);fx(11,30,'Bonifacio Day',R);fx(12,8,'Feast of the Immaculate Conception',SP);fx(12,24,'Christmas Eve',SP);fx(12,25,'Christmas Day',R);fx(12,30,'Rizal Day',R);fx(12,31,'Last Day of the Year',SP);
 return HC[y]=o}
function holidays(y){const off=new Set(DB.hol.off);return baseHol(y).filter(h=>!off.has(h.date+'|'+h.name)).concat(DB.hol.add.filter(h=>+h.date.slice(0,4)===y)).sort((a,b)=>a.date.localeCompare(b.date))}
// one entry per date; a regular holiday wins over a special day on the same date
function holsIn(y,m,q){const [a,b]=cutoff(y,m,q),by=new Map();holidays(y).forEach(h=>{if(h.date<a||h.date>b)return;const o=by.get(h.date);if(!o||(h.type==='R'&&o.type!=='R'))by.set(h.date,{date:h.date,name:o&&o.type===h.type?o.name+' / '+h.name:h.name,type:h.type});else if(o.type===h.type)o.name+=' / '+h.name});return [...by.values()].filter(h=>h.type==='R'||h.type==='S')}

// ---------------------------------------------------------------- time, holidays and premiums -> basic, holiday pay, overtime & premium pay
function timeCalc(r,run){
 const P=S().prem,tm=r.tm||{},mo=r.basis==='monthly',daily=r.daily,H=daily/8,fac=+r.factor||261;
 const L=[],late=pos(+tm.late||0),leave=pos(+tm.leave||0),lateAmt=Math.round(late/480*daily);
 let basic,days,absAmt=0,wd;
 if(mo){const abs=pos(+tm.abs||0);absAmt=Math.round(abs*daily);basic=pos(Math.round((r.monthly||0)/2)-absAmt-lateAmt);days=pos(fac/24-abs-late/480);wd=days}
 else{wd=pos(+tm.days||0);basic=pos(Math.round((wd+leave)*daily)-lateAmt);days=pos(wd+leave-late/480)}
 let hol=0,ot=0,whol=0;
 const add=(k,label,hrs,pct)=>{hrs=pos(+hrs||0);if(!hrs||!pct)return;const a=Math.round(hrs*H*pct/100);if(k==='hol')hol+=a;else ot+=a;L.push({k,label,hrs,pct,amt:a})};
 add('ot','Overtime (ordinary day)',tm.ot,P.ot);add('ot','Night differential',tm.nd,P.nd);add('ot','Rest day work',tm.rd,P.rd);add('ot','Rest day overtime',tm.rdot,P.rdot);
 const present=mo||wd+leave>0;
 holsIn(run.year,run.month,run.q).forEach(h=>{
  const x=(tm.hol||{})[h.date]||{},s=x.s||(h.type==='R'?(present?'paid':'none'):'off'),dl=fd(h.date).replace(/, \d{4}$/,'');
  if(h.type==='R'){
   if(s==='paid'){if(!mo){hol+=daily;L.push({k:'hol',label:'Regular holiday, not worked ('+dl+')',hrs:8,pct:100,amt:daily})}}
   else if(s==='worked'){whol++;const pct=x.rd?P.rhrd:P.rh;add('hol','Regular holiday worked'+(x.rd?' on rest day':'')+' ('+dl+')',x.h==null?8:x.h,mo?pct-100:pct);add('ot','Regular holiday overtime ('+dl+')',x.ot,x.rd?P.rhrdot:P.rhot)}
  }else if(s==='worked'){whol++;const pct=x.rd?P.sprd:P.sp;add('hol','Special day worked'+(x.rd?' on rest day':'')+' ('+dl+')',x.h==null?8:x.h,mo?pct-100:pct);add('ot','Special day overtime ('+dl+')',x.ot,x.rd?P.sprdot:P.spot)}
 });
 const allowDays=mo?days:pos(wd+whol-late/480);
 return{basic,days:r4(days),hol,ot,lateAmt,absAmt,leave,allowDays:r4(allowDays),allow:Math.round(allowDays*(r.allowance||0)),lines:L,whol};
}

// ---------------------------------------------------------------- earnings of a row
function earn(r){
 let xe=0,xT=0,xN=0,xDM=0,xB=0,xS=0,xd=0;
 DB.items.forEach(it=>{const v=(r.items||{})[it.id]||0;if(!v)return;if(it.kind==='D'){xd+=v;return}xe+=v;if(it.tax==='T'){xT+=v;if(it.sss)xS+=v}else if(it.tax==='N')xN+=v;else if(it.tax==='DM')xDM+=v;else xB+=v});
 const gross=r.basic+r.allow+r.hol+r.ot+xe;
 let dt=0;Object.values(r.ded||{}).forEach(v=>dt+=v||0);
 const ded=r.sss+r.ph+r.pg+r.tax+dt+xd;
 return{xe,xT,xN,xDM,xB,xS,xd,dt,gross,ded,net:gross-ded};
}

// ---------------------------------------------------------------- government contributions (monthly, split by cutoff)
function sssOf(mo){const R=S().rates.sss;if(mo<=0)return{msc:0,ee:0,er:0,ec:0};const m=mo/100,half=R.step/2;
 const msc=m<R.min+half?R.min:Math.min(R.max,R.min+Math.floor((m-(R.min-half))/R.step)*R.step);
 return{msc,ee:Math.round(msc*R.ee),er:Math.round(msc*R.er),ec:Math.round((msc<R.ecAt?R.ecLow:R.ecHigh)*100)}}
function phOf(mo){const R=S().rates.ph;if(mo<=0)return{ee:0,er:0};const base=Math.min(R.ceil,Math.max(R.floor,mo/100)),tot=Math.round(base*R.rate),ee=Math.round(tot/2);return{ee,er:tot-ee}}
function hdmfOf(mo){const R=S().rates.hdmf;if(mo<=0)return{ee:0,er:0};const m=mo/100,b=Math.min(m,R.cap);return{ee:Math.round(b*(m<=R.low?R.eeLow:R.ee)),er:Math.round(b*R.er)}}
const sssBase=r=>r.basic+r.hol+r.ot+earn(r).xS+(S().mealNT?0:r.allow);
const phBase=r=>r.basic;
function otherRow(run,empId){const o=runOf(run.year,run.month,3-run.q);return o?o.rows.find(x=>x.empId===empId):null}
function contrib(run,r){
 const cfg=S(),D={sss:0,ph:0,pg:0,erSss:0,erEc:0,erPh:0,erPg:0};
 if(!(r.basic+r.hol+r.ot+r.allow+earn(r).xe))return D;
 if(run.q===1&&cfg.sched==='second')return D;
 const o=otherRow(run,r.empId);let Sx,Px,Gx,frac=1,less=null;
 if(run.q===1){Sx=sssOf(sssBase(r)*2);Px=phOf(phBase(r)*2);Gx=hdmfOf(phBase(r)*2);frac=.5}
 else{Sx=sssOf(sssBase(r)+(o?sssBase(o):0));Px=phOf(phBase(r)+(o?phBase(o):0));Gx=hdmfOf(phBase(r)+(o?phBase(o):0));if(o&&cfg.sched==='split')less=o}
 const part=(v,k)=>pos(Math.round(v*frac)-(less?(less[k]||0):0));
 D.sss=part(Sx.ee,'sss');D.ph=part(Px.ee,'ph');D.pg=part(Gx.ee,'pg');D.erSss=part(Sx.er,'erSss');D.erEc=part(Sx.ec,'erEc');D.erPh=part(Px.er,'erPh');D.erPg=part(Gx.er,'erPg');
 return D;
}

// ---------------------------------------------------------------- year-to-date (earlier payroll runs of the same year + opening balances)
function ytd(run,empId,f){let t=0;const k=pkey(run.year,run.month,run.q);
 DB.runs.forEach(x=>{if(x.year!==run.year||pkey(x.year,x.month,x.q)>=k)return;const r=x.rows.find(y=>y.empId===empId);if(r)t+=r[f]||0});
 const o=((DB.ytd[run.year]||{})[empId]||{});return t+(o[f]||0)}
function dmSplit(run,r){let inn=0,ex=0;
 DB.items.filter(it=>it.kind!=='D'&&it.tax==='DM').forEach(it=>{const v=(r.items||{})[it.id]||0;if(!v)return;const lim=it.limit||0,per=it.per||'N';
  if(per==='N'||!lim){inn+=v;return}
  let prior=0;const k=pkey(run.year,run.month,run.q);
  DB.runs.forEach(x=>{if(x.year!==run.year||pkey(x.year,x.month,x.q)>=k)return;if(per==='M'&&x.month!==run.month)return;if(per==='S'&&(x.month<=6)!==(run.month<=6))return;const o=x.rows.find(y=>y.empId===r.empId);if(o)prior+=(o.items||{})[it.id]||0});
  const over=pos(prior+v-lim)-pos(prior-lim);ex+=over;inn+=v-over});
 return{inn,ex}}
function taxCalc(run,r){
 const cfg=S(),E=earn(r),mwe=isMwe(empById(r.empId),r),dm=dmSplit(run,r);
 const ben=E.xB+dm.ex,yb=ytd(run,r.empId,'ben'),benEx=pos(yb+ben-cfg.benCap)-pos(yb-cfg.benCap);
 const reg=r.basic+r.hol+r.ot+(cfg.mealNT?0:r.allow),mweEx=mwe?r.basic+r.hol+r.ot:0,contr=r.sss+r.ph+r.pg;
 const taxable=mwe?pos(reg-mweEx+E.xT+benEx):pos(reg+E.xT+benEx-contr);
 let tax=wtaxSemi(taxable),annual=false;
 if(cfg.annualize&&run.month===12&&run.q===2){tax=taxYear(ytd(run,r.empId,'taxable')+taxable)-ytd(run,r.empId,'tax');annual=true}
 return{tax,taxable,ben,benEx,dmIn:dm.inn,mweEx,nItems:E.xN,mealNT:cfg.mealNT?r.allow:0,annual};
}
// recompute one row from its time sheet; manual amounts (r.man) are kept
function calcRow(run,r){
 const t=timeCalc(r,run),man=r.man||{};
 r.basic=t.basic;r.days=t.days;r.leave=t.leave;r.lateAmt=t.lateAmt;r.absAmt=t.absAmt;r.lines=t.lines;r.allowDays=t.allowDays;
 if(!man.allow)r.allow=t.allow;if(!man.hol)r.hol=t.hol;if(!man.ot)r.ot=t.ot;
 const D=contrib(run,r);
 if(!man.sss)r.sss=D.sss;if(!man.ph)r.ph=D.ph;if(!man.pg)r.pg=D.pg;
 // employer shares follow the employee share when it was typed by hand
 const R=S().rates.sss;r.erSss=man.sss?(r.sss?Math.round(r.sss*R.er/R.ee):0):D.erSss;r.erEc=man.sss?(r.sss?D.erEc:0):D.erEc;
 r.erPh=man.ph?r.ph:D.erPh;r.erPg=man.pg?(r.pg?D.erPg:0):D.erPg;
 const T=taxCalc(run,r);if(!man.tax)r.tax=T.tax;
 Object.assign(r,{taxable:T.taxable,ben:T.ben,benEx:T.benEx,dmIn:T.dmIn,mweEx:T.mweEx,nItems:T.nItems,mealNT:T.mealNT,annual:T.annual});
 const E=earn(r);r.gross=E.gross;r.totDed=E.ded;r.net=E.net;
 return r;
}
function calcRun(run){run.rows.forEach(r=>calcRow(run,r))}
// later runs of the same year depend on earlier ones (contributions of the month, de minimis and benefit limits, year-end tax)
function recalcFrom(run){const k=pkey(run.year,run.month,run.q);DB.runs.filter(x=>x.year===run.year&&pkey(x.year,x.month,x.q)>=k&&x.status!=='final').sort((a,b)=>pkey(a.year,a.month,a.q)-pkey(b.year,b.month,b.q)).forEach(calcRun)}

// ---------------------------------------------------------------- loans, advances and other charges per employee
function ledgerDeducted(empId,type,exceptRun){let t=0;DB.runs.forEach(x=>{if(x===exceptRun)return;const r=x.rows.find(y=>y.empId===empId);if(r)t+=(r.ded||{})[type]||0});return t}
function ledgerBal(empId,type,exceptRun){let c=0;DB.ledger.forEach(l=>{if(l.empId===empId&&l.type===type)c+=l.amount});return c-ledgerDeducted(empId,type,exceptRun)}
// amount to deduct this cutoff: each open charge (oldest first) contributes its installment, or its whole balance when no installment was set
function ledgerSuggest(empId,type,run){
 const L=DB.ledger.filter(l=>l.empId===empId&&l.type===type&&(!run||!l.start||l.start<=cutoff(run.year,run.month,run.q)[1])).sort((a,b)=>cmp(a.date,b.date));
 let used=ledgerDeducted(empId,type,run),s=0;
 L.forEach(l=>{const take=Math.min(used,l.amount);used-=take;const left=l.amount-take;if(left>0)s+=l.inst>0?Math.min(l.inst,left):left});
 return Math.min(s,pos(ledgerBal(empId,type,run)));
}
function rowFromEmp(e,run){
 const r={empId:e.id,name:fullName(e),business:e.business||'',position:e.position||'',status:e.status||'',basis:e.basis||'daily',rate:e.rate||0,monthly:e.monthly||0,factor:+e.factor||261,daily:dailyOf(e),allowance:e.allowance||0,
  tm:e.basis==='monthly'?{abs:0}:{days:0},items:{},ded:{},man:{},basic:0,allow:0,hol:0,ot:0,sss:0,ph:0,pg:0,tax:0};
 DB.dtypes.forEach(d=>{const v=ledgerSuggest(e.id,d.id,run);if(v)r.ded[d.id]=v});
 (e.recur||[]).forEach(x=>{if(x.amt&&DB.items.some(i=>i.id===x.item))r.items[x.item]=(r.items[x.item]||0)+x.amt});
 return r;
}

 const LC=def.labelCol||0,totLine=(t,label,cls)=>'<tr class="'+cls+'">'+cols.map((c,i)=>'<td class="'+(c.n||c.d?'n r':'')+'">'+(i===LC?esc(label):c.sumNo?'':(c.n?m2(t[c.h]):c.d?fN(t[c.h]):''))+'</td>').join('')+'</tr>';
 let body='';
 if(G){const g=new Map();rows.forEach(r=>{const k=r[G]||'';if(!g.has(k))g.set(k,[]);g.get(k).push(r)});const multi=g.size>1;
  [...g.keys()].sort(cmp).forEach(k=>{const L=g.get(k);if(multi)body+='<tr class="g"><td colspan="'+cols.length+'">'+esc(k||'(no business)')+'</td></tr>';body+=L.map(r=>line(r)).join('');if(multi)body+=totLine(sum(L),'Subtotal – '+(k||'(no business)'),'st')})}
 else body=rows.map(r=>line(r)).join('');
 const T=sum(rows),hasTot=def.total!==false&&cols.some(c=>c.n||c.d);
 const thead='<tr>'+cols.map(c=>'<th class="'+(c.n||c.d?'n':'')+'">'+esc(c.h)+'</th>').join('')+'</tr>';
 const screen='<div class="tw"><table class="t"><thead>'+thead+'</thead><tbody>'+(body||'<tr><td colspan="'+cols.length+'" class="empty">'+esc(def.empty||'Nothing to show.')+'</td></tr>')+'</tbody>'+(hasTot&&rows.length?'<tfoot>'+totLine(T,'TOTAL ('+rows.length+')','gt')+'</tfoot>':'')+'</table></div>';
 const print='<table class="rt"><thead>'+thead+'</thead><tbody>'+body+(hasTot&&rows.length?totLine(T,'TOTAL ('+rows.length+')','gt'):'')+'</tbody></table>';
 const csv=()=>{const out=[];(def.csvHead||[]).forEach(h=>out.push(h));out.push(cols.map(c=>c.h));rows.forEach(r=>out.push(cols.map(c=>{const v=val(c,r);return c.n?p2(v):c.d?r4(+v||0):v==null?'':v})));if(hasTot&&rows.length)out.push(cols.map((c,i)=>i===LC?'TOTAL':c.sumNo?'':c.n?p2(T[c.h]):c.d?r4(T[c.h]):''));return toCsv(out)};
 return{screen,print,csv,T};
}

 ytd(B){let y=new Date().getFullYear();const F=[['gross','Gross compensation'],['taxable','Taxable compensation'],['tax','Tax withheld'],['ben','13th month & benefits received (non-taxable part)'],['contAll','SSS, PhilHealth, Pag-IBIG (employee share)'],['basic13','Basic salary earned (for 13th month)'],['paid13','13th month already paid']];

   $('#yImp').onclick=()=>{const m=modal('<h2>Paste opening balances</h2><p class="note">Paste the downloaded CSV after filling it in (with its header row). Employees are matched by name.</p><textarea id="yTx" rows="10" style="width:100%"></textarea><div class="acts"><button class="btn o" data-x>Cancel</button><button class="btn" id="yGo">Import</button></div>',760);
    $('#yGo',m).onclick=()=>{const rows=parseCsv($('#yTx',m).value);if(rows.length<2)return toast('Paste the header and rows.','bad');let n=0;DB.ytd[y]=DB.ytd[y]||{};
     rows.slice(1).forEach(r=>{const e=DB.employees.find(x=>fullName(x).toLowerCase()===String(r[0]).trim().toLowerCase());if(!e)return;DB.ytd[y][e.id]={};F.forEach((f,i)=>DB.ytd[y][e.id][f[0]]=c100(r[i+2]));n++});save();m.close();paint();toast(n+' employees updated.','ok')}}};paint()},
 data(B){const age=backupAge();

   +'<div class="card"><h2>Storage</h2><p class="note" id="dSt"></p></div>'

  $('#dFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{let d;try{d=JSON.parse(rd.result)}catch(x){return toast('That file is not an AJ Payroll backup.','bad')}
   if(!d||!Array.isArray(d.employees)||!Array.isArray(d.runs))return toast('That file is not an AJ Payroll backup.','bad');

function bizForm(name,after){
 const b=name?bizInfo(name):{name:''},has=name&&DB.biz.some(x=>x.name===name);
 const m=modal('<h2>'+(name?'Edit business':'Add business')+'</h2><div class="grid2">'+fg('Business name *','<input id="bN" value="'+esc(b.name)+'">','As it should appear on payslips')+fg('TIN','<input id="bT" value="'+esc(b.tin||'')+'">')+fg('RDO code','<input id="bR" value="'+esc(b.rdo||'')+'">')
  +fg('Registered address','<input id="bA" value="'+esc(b.address||'')+'">')+fg('SSS employer no.','<input id="bS" value="'+esc(b.sss||'')+'">')+fg('PhilHealth employer no.','<input id="bP" value="'+esc(b.ph||'')+'">')+fg('Pag-IBIG employer no.','<input id="bH" value="'+esc(b.hdmf||'')+'">')+'</div>'
  +'<div class="acts">'+(name?'<button class="btn d" id="bDel" style="margin-right:auto">Remove</button>':'')+'<button class="btn o" data-x>Cancel</button><button class="btn" id="bGo">Save</button></div>',720);
 $('#bGo',m).onclick=()=>{const n=$('#bN',m).value.trim();if(!n)return toast('Enter the name.','bad');if(n!==name&&bizList().includes(n))return toast('That business already exists.','bad');

  save();m.close();after();toast('Saved.','ok')};
 const d=$('#bDel',m);if(d)d.onclick=()=>{if(DB.employees.some(e=>e.business===name))return toast('Move or remove its employees first.','bad');DB.biz=DB.biz.filter(x=>x.name!==name);save();m.close();after()};
}
function itemForm(id,after){
 const it=id?DB.items.find(x=>x.id===id):null,v=it||{name:'',kind:'E',tax:'T',sss:0,limit:0,per:'M'},used=id&&DB.runs.some(r=>r.rows.some(x=>(x.items||{})[id]));
 const m=modal('<h2>'+(it?'Edit pay item':'Add pay item')+'</h2><div class="grid2">'+fg('Name *','<input id="tN" value="'+esc(v.name)+'">')+fg('Kind','<select id="tK"'+(used||(it&&it.fixed)?' disabled':'')+'>'+opt([['E','Earning (added to pay)'],['D','Deduction (taken from pay)']],v.kind)+'</select>')
  +fg('Tax treatment','<select id="tT"'+(it&&it.fixed?' disabled':'')+'>'+opt(Object.entries(TAXK),v.tax)+'</select>','','gT')+fg('Tax-free limit (₱)','<input type="number" step="0.01" min="0" id="tL" value="'+pe(v.limit)+'">','For de minimis benefits, e.g. rice subsidy ₱2,000 a month','gL')
  +fg('Limit applies','<select id="tP">'+opt([['M','per month'],['S','per semester'],['Y','per year']],v.per||'M')+'</select>','','gP')+fg('Part of the SSS base','<select id="tS">'+opt([['0','No'],['1','Yes (e.g. commissions)']],v.sss?'1':'0')+'</select>','','gS')+'</div>'
  +'<p class="note">De minimis limits change from time to time. Check the current BIR regulations before relying on them.</p>'
  +'<div class="acts">'+(it&&!it.fixed?'<button class="btn d" id="tDel" style="margin-right:auto">'+(used?'Hide':'Delete')+'</button>':'')+(it&&it.active===false?'<button class="btn o" id="tShow">Show again</button>':'')+'<button class="btn o" data-x>Cancel</button><button class="btn" id="tGo">Save</button></div>',700);
 const sync=()=>{const e=$('#tK',m).value!=='D',t=$('#tT',m).value;$('#gT',m).hidden=!e;$('#gL',m).hidden=!(e&&t==='DM');$('#gP',m).hidden=!(e&&t==='DM');$('#gS',m).hidden=!(e&&t==='T')};
 $('#tK',m).onchange=sync;$('#tT',m).onchange=sync;sync();
 $('#tGo',m).onclick=()=>{const n=$('#tN',m).value.trim();if(!n)return toast('Enter a name.','bad');const o={name:n,kind:$('#tK',m).value,tax:$('#tT',m).value,limit:c100($('#tL',m).value),per:$('#tP',m).value,sss:$('#tS',m).value==='1'?1:0};
  if(o.kind==='D'){o.tax='';o.sss=0;o.limit=0}if(it)Object.assign(it,o);else DB.items.push(Object.assign({id:'i'+uid()},o));save();m.close();after();toast('Saved.','ok')};
 const d=$('#tDel',m);if(d)d.onclick=()=>{if(used)it.active=false;else DB.items=DB.items.filter(x=>x!==it);save();m.close();after()};
 const s=$('#tShow',m);if(s)s.onclick=()=>{it.active=true;save();m.close();after()};
}
