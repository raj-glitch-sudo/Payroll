<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Payroll</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14231e;--muted:#5b6b66;--line:#d9e3df;--line2:#eef3f1;--brand:#016351;--brand2:#e6f3ef;--brand-ink:#fff;--danger:#b42318;--danger2:#fde8e6;--warn:#9a5b00;--warn2:#fff4dc;--ok:#13795b;--ok2:#dcf3e8;--side:#0f2a24;--side-ink:#cfe3dc;--focus:0 0 0 3px rgba(1,99,81,.25);--r:10px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0 0 .5rem;line-height:1.25}h1{font-size:1.35rem}h2{font-size:1.1rem}h3{font-size:.98rem}
.side{width:236px;flex:0 0 236px;transition:width .18s,flex-basis .18s;overflow-x:hidden;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;color:#fff}
.brand .logo{width:34px;height:34px;border-radius:9px;background:#18a383;display:grid;place-items:center;font-weight:800;color:#06221c;letter-spacing:-.5px}
.brand b{display:block;font-size:1rem}.brand small{display:block;color:#8fb3a8;font-size:.75rem;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{list-style:none;margin:0;padding:6px 8px 16px}
.nav .sec{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#7fa196;padding:14px 10px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:8px 10px;white-space:nowrap;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:#18a383;color:#06221c;font-weight:700}
.nav a.sub{padding-left:28px;font-size:.92rem}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;overflow:auto}
.top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h1{margin:0;font-size:1.15rem;flex:1;min-width:0}
.top .st{font-size:.8rem;color:var(--muted)}
.menu{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:0 0 auto}.menu:hover{background:var(--brand2)}.menu svg{width:18px;height:18px}
.nav svg{width:19px;height:19px;flex:0 0 19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.navc .side{width:64px;flex-basis:64px}body.navc .brand{padding:18px 15px 14px}body.navc .brand>div:last-child,body.navc .nav a span{display:none}body.navc .nav .sec{font-size:0;padding:8px 0;margin:6px 10px 2px;border-top:1px solid rgba(255,255,255,.12)}body.navc .nav a{justify-content:center;padding:9px 0}body.navc #toasts{left:80px}
.side .tip{position:fixed;z-index:300;background:#13241f;color:#fff;font-size:.8rem;padding:4px 9px;border-radius:6px;pointer-events:none;white-space:nowrap}
#view{padding:20px 22px 60px;max-width:1500px;width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.row.mid{align-items:center}
.sp{flex:1}
.fg{display:flex;flex-direction:column;gap:4px;min-width:120px}
.fg label{font-size:.78rem;font-weight:600;color:var(--muted)}
.fg small{color:var(--muted);font-size:.76rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 12px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:none;box-shadow:var(--focus);border-color:var(--brand)}
input[type=checkbox]{width:auto}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.o{background:#fff;color:var(--brand)}
.btn.d{background:#fff;color:var(--danger);border-color:#e7b4ae}
.btn.s{padding:4px 9px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{color:var(--muted);font-size:.85rem;margin:.3rem 0 .6rem}
.chip{display:inline-block;border-radius:99px;padding:1px 8px;font-size:.74rem;font-weight:700;background:var(--line2);color:var(--muted)}
.chip.ok{background:var(--ok2);color:var(--ok)}.chip.warn{background:var(--warn2);color:var(--warn)}.chip.bad{background:var(--danger2);color:var(--danger)}
.alert{border-radius:10px;padding:10px 12px;margin:0 0 12px;background:var(--warn2);color:#5c3a00;border:1px solid #f1d49b}
.alert.info{background:var(--brand2);color:#0b3d32;border-color:#bfe0d6}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi>span{display:block;font-size:.78rem;color:var(--muted);font-weight:600}.kpi b{display:block;font-size:1.3rem;margin:.15rem 0}.kpi small{color:var(--muted)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--card);max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
table.t th,table.t td{padding:6px 9px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle;white-space:nowrap}
table.t thead th{position:sticky;top:0;background:#f7faf9;z-index:2;font-size:.76rem;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
table.t tfoot td{position:sticky;bottom:0;background:#f7faf9;font-weight:700;border-top:1px solid var(--line);z-index:2}
table.t .n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.off td{opacity:.55}
table.t tr.g td{background:#f2f8f6;font-weight:700}
table.t tbody tr:hover td{background:#fafcfb}
table.t td.wrap{white-space:normal;min-width:180px}
.grid td,.grid th{padding:3px 4px}
.grid th{text-align:center!important;white-space:normal!important;min-width:76px;line-height:1.15}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:210px;max-width:260px;white-space:normal;text-align:left!important}
.grid thead th:first-child{z-index:3;background:#f7faf9}
.grid tfoot td:first-child{z-index:3;background:#f7faf9}
.grid input{width:92px;text-align:right;padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.grid input.days{width:62px}
.grid input.man{background:#fff8e6;border-color:#e8c46a}
.grid input.auto{color:#3f6a5e;background:#f7fbf9}
.grid td.calc{color:#33433e;text-align:right;font-variant-numeric:tabular-nums;padding-right:8px}
.grid td.net{font-weight:700}
.grid .neg{color:var(--danger)}
.grid .nm b{display:block}.grid .nm small{color:var(--muted)}
.grid th.grpE{background:#eef8f4}.grid th.grpD{background:#fbf1ef}
.grid .tm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px;cursor:pointer;margin-left:4px}
.grid .tm.on{background:var(--brand2);border-color:#9fd2c4}
.grid.locked input{background:transparent;border-color:transparent;pointer-events:none;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs a,.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;text-decoration:none;color:var(--ink);font-weight:600;cursor:pointer}
.tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ov{position:fixed;inset:0;background:rgba(10,25,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:100;overflow:auto}
.md{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.md h2{margin-top:0}
.md .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
#toasts{position:fixed;left:252px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#toasts .toast{pointer-events:auto;cursor:pointer}
.toast{background:#13241f;color:#fff;border-radius:10px;padding:10px 14px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:.9rem}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--danger)}
.bkst{font-size:.78rem;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}.bkst.ok{background:var(--ok2);color:var(--ok)}.bkst.warn{background:var(--warn2);color:var(--warn)}
#bkBtn.due{background:var(--brand);color:#fff;animation:bkp 1.6s ease-in-out 3}@keyframes bkp{50%{box-shadow:0 0 0 6px rgba(1,99,81,.18)}}
#abCard{position:fixed;right:16px;bottom:16px;z-index:95;width:min(360px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px 14px}#abCard b{display:block;margin-bottom:2px}#abCard p{margin:0 0 10px;color:var(--muted);font-size:.86rem}
@media(max-width:900px){#bkSt{display:none}}
.pv{width:100%;height:72vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.hl{display:grid;gap:6px}
.hl .h{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.6fr) 70px 70px auto;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line2);border-radius:8px}
.hl .h small{color:var(--muted)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px}
.out div{background:var(--brand2);border-radius:8px;padding:8px 10px}.out span{display:block;font-size:.75rem;color:#2c5348}.out b{font-size:1.05rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700}
.kbd{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:var(--line2);border-radius:4px;padding:0 4px}
@media(max-width:900px){#toasts{left:12px;right:12px}.side{position:fixed;left:-250px;z-index:90;transition:left .2s}.side.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}#view{padding:14px}body.navc .side{width:236px;flex-basis:236px}body.navc .brand>div:last-child,body.navc .nav a span{display:initial}body.navc .nav a{justify-content:flex-start;padding:8px 10px}body.navc .nav .sec{font-size:.68rem;padding:14px 10px 4px;border:0;margin:0}}
@media print{body{display:block}.side,.top{display:none}}

[hidden]{display:none!important}
/* view switch, copy box, checks */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.seg button{border:0;background:none;padding:7px 14px;font:inherit;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}.seg button+button{border-left:1px solid var(--line)}.seg button.on{background:var(--brand2);color:var(--ink)}
.copybox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 12px;background:#fafcfb}
label.ck{display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;font-size:.9rem;font-weight:400}label.ck input{margin-top:3px}
.checks{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}.ckr{border:1px solid var(--line);border-left:4px solid #9fb3ad;border-radius:8px;padding:8px 10px;font-size:.88rem}.ckr.warn{border-left-color:#e0a02a}.ckr.bad{border-left-color:var(--danger)}.ckr .nl{color:var(--muted);margin-top:3px;font-size:.82rem}
/* time sheet */
.grid.tg th small{display:block;font-weight:500;color:var(--muted);font-size:.68rem;margin-top:2px}
.grid.tg input{width:64px}.grid.tg input.na{background:transparent;border-color:transparent;text-align:center;color:#a9b5b1}.grid.tg input.bad{background:#fdecea;border-color:#e7a19a}
.grid.tg td.hc{white-space:nowrap}.grid.tg td.hc select{width:118px;padding:4px;font-size:.8rem}.grid.tg td.hc input{width:52px;margin-left:3px}.grid.tg th.hcol{min-width:180px}
/* searchable picker */
.cb{position:relative;min-width:220px}.cb>input{width:100%}.cb-sel{position:absolute!important;left:0;top:0;width:1px!important;height:1px!important;opacity:0;pointer-events:none}
.cb-list{position:absolute;left:0;right:0;top:calc(100% + 2px);max-height:280px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 26px rgba(0,0,0,.14);z-index:250;padding:4px}
.cb-list>div{padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.9rem}.cb-list>div.on{background:var(--brand2)}.cb-list>div:hover{background:#f1f6f4}.cb-list .none{color:var(--muted);cursor:default}
/* employees selection */
.selbar{margin:0 0 8px;min-height:32px}.t th.cbc,.t td.cbc{width:34px;text-align:center}.t tr.sel td{background:#f2faf7}
.kvt{width:100%}.kvt td{vertical-align:middle;white-space:normal!important}.kvt td small{display:block;color:var(--muted);font-weight:400;margin-top:2px}.kvt td:last-child{white-space:nowrap;width:1%}.kvt input{width:130px}.kvt #fpSil{width:70px}
</style>
</head>
<body>
<aside class="side" id="side">
 <div class="brand"><div class="logo">AJ</div><div><b>AJ Payroll</b><small id="brandSub">Offline payroll</small></div></div>
 <ul class="nav" id="nav"></ul>
</aside>
<div class="main">
 <header class="top"><button class="menu" id="menuBtn" aria-label="Collapse menu" aria-controls="side" aria-expanded="true" title="Collapse or expand the menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1 id="ttl">AJ Payroll</h1><span class="st" id="saveSt"></span><span id="bkSt"></span><button class="btn o s" id="bkBtn" title="Download a backup of all payroll data">Backup</button></header>
 <div id="view"></div>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
// =====================================================================================
// AJ Payroll – standalone offline payroll (Philippines). All money is kept in centavos.
// =====================================================================================
const KEY='ajpay_v1',VER='1.0';
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const c100=v=>{const n=parseFloat(String(v==null?'':v).replace(/[,₱\s]/g,''));return Number.isFinite(n)?Math.round(n*100):0};
const n2=c=>{c=Math.round(c||0);const s=(Math.abs(c)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});return c<0?'('+s+')':s};
const m2=c=>c?n2(c):'–';
const pe=c=>c?(c/100).toFixed(2):'';            // value for an <input>
const p2=c=>((c||0)/100).toFixed(2);            // value for CSV
const r4=n=>Math.round(n*10000)/10000;
const fN=n=>{n=r4(n||0);return n?String(n):'–'};
const pos=v=>Math.max(0,v);
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const pad=n=>String(n).padStart(2,'0'),ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const lastDay=(y,m)=>new Date(y,m,0).getDate();
const today=()=>{const d=new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate())};
const cutoff=(y,m,q)=>[ymd(y,m,q===1?1:16),ymd(y,m,q===1?15:lastDay(y,m))];
const perLabel=(y,m,q)=>MN[m-1]+' '+(q===1?'1–15':'16–'+lastDay(y,m))+', '+y;
const perShort=(y,m,q)=>MN[m-1].slice(0,3)+' '+(q===1?'1–15':'16–'+lastDay(y,m))+' '+y;
const pkey=(y,m,q)=>y*100+m*4+q;
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const fdw=s=>new Date(s+'T00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
const cmp=(a,b)=>String(a==null?'':a).localeCompare(String(b==null?'':b),undefined,{numeric:true,sensitivity:'base'});
const slug=s=>String(s||'').replace(/[^\w]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'file';

// ---------------------------------------------------------------- built-in rules (editable in Settings)
const DEF_RATES={sss:{ee:5,er:10,min:5000,max:35000,step:500,ecLow:10,ecHigh:30,ecAt:15000},ph:{rate:5,floor:10000,ceil:100000},hdmf:{eeLow:1,ee:2,er:2,low:1500,cap:10000},asOf:'2026'};
const DEF_PREM={ot:125,nd:10,rd:130,rdot:169,sp:130,sprd:150,spot:169,sprdot:195,rh:200,rhrd:260,rhot:260,rhrdot:338};
const PREM_LBL={ot:'Overtime, ordinary day',nd:'Night differential (added on top)',rd:'Rest day work',rdot:'Rest day overtime',sp:'Special non-working day worked',sprd:'Special day that is also a rest day',spot:'Special day overtime',sprdot:'Special day + rest day overtime',rh:'Regular holiday worked',rhrd:'Regular holiday that is also a rest day',rhot:'Regular holiday overtime',rhrdot:'Regular holiday + rest day overtime'};
// BIR withholding tax on compensation, semi-monthly (RR 11-2018 Annex E, rates from Jan 1, 2023): [over, fixed tax, % of excess]
const WT_SEMI=[[10417,0,15],[16667,937.5,20],[33333,4270.7,25],[83333,16770.7,30],[333333,91770.7,35]];
// Annual graduated income tax (TRAIN, from 2023)
const WT_YEAR=[[250000,0,15],[400000,22500,20],[800000,102500,25],[2000000,402500,30],[8000000,2202500,35]];
const bracket=(t,x)=>{let v=0;for(const r of t)if(x>r[0])v=r[1]+(x-r[0])*r[2]/100;return v};
const wtaxSemi=c=>Math.round(bracket(WT_SEMI,c/100)*100);
const taxYear=c=>Math.round(bracket(WT_YEAR,c/100)*100);
const STATUSES=['Regular','Probationary','Contractual','Casual','Project','Seasonal'];
const DEF_ITEMS=[
 {id:'m13',name:'13th Month Pay',kind:'E',tax:'B',fixed:1},
 {id:'sil',name:'Service Incentive Leave Pay',kind:'E',tax:'T'},
 {id:'com',name:'Commission',kind:'E',tax:'T',sss:1},
 {id:'inc',name:'Incentive / Bonus',kind:'E',tax:'B'},
 {id:'rice',name:'Rice Subsidy',kind:'E',tax:'DM',limit:200000,per:'M'},
 {id:'adj',name:'Salary Adjustment',kind:'E',tax:'T',sss:1},
 {id:'ntx',name:'Other Non-taxable Pay (reimbursement)',kind:'E',tax:'N'},
 {id:'uni',name:'Uniform',kind:'D'},
 {id:'odd',name:'Other Deduction',kind:'D'}];
const DEF_DTYPES=['Cash Advance','Credit','Credit Balance','SSS Loan','Pag-IBIG Loan'];
const TAXK={T:'Taxable',N:'Non-taxable',DM:'De minimis (tax-free up to a limit)',B:'13th month & other benefits (tax-free up to ₱90,000 a year)'};

// ---------------------------------------------------------------- data
let DB=null;
function blank(){return{v:1,company:{name:''},biz:[],settings:{sched:'split',mealNT:true,annualize:true,mweRate:0,silDays:5,autoBk:5,benCap:9000000,rates:clone(DEF_RATES),prem:clone(DEF_PREM)},
 items:clone(DEF_ITEMS),dtypes:DEF_DTYPES.map((n,i)=>({id:'d'+(i+1),name:n})),employees:[],ledger:[],runs:[],hol:{add:[],off:[]},ytd:{},meta:{created:new Date().toISOString(),lastBackup:null}}}
function migrate(d){
 const b=blank();if(!d||typeof d!=='object')return b;
 for(const k of Object.keys(b))if(d[k]==null||typeof d[k]!==typeof b[k]||Array.isArray(b[k])!==Array.isArray(d[k]))d[k]=b[k];
 d.settings=Object.assign(b.settings,d.settings);d.settings.rates=Object.assign(clone(DEF_RATES),d.settings.rates||{});d.settings.prem=Object.assign(clone(DEF_PREM),d.settings.prem||{});
 ['sss','ph','hdmf'].forEach(k=>d.settings.rates[k]=Object.assign(clone(DEF_RATES[k]),d.settings.rates[k]||{}));
 if(!d.items.some(i=>i.id==='m13'))d.items.unshift(clone(DEF_ITEMS[0]));
 d.hol=Object.assign({add:[],off:[]},d.hol);d.meta=Object.assign(b.meta,d.meta);
 d.runs.forEach(r=>r.rows.forEach(x=>{x.items=x.items||{};x.ded=x.ded||{};x.man=x.man||{};x.tm=x.tm||{}}));
 return d;
}
// storage: IndexedDB (room for many years of payroll), with a copy in localStorage while it fits
const IDB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('ajpay',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{IDB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},

function timeCalc(r,run){

 let basic,days,absAmt=0,wd;
 if(mo){const abs=pos(+tm.abs||0);absAmt=Math.round(abs*daily);basic=pos(Math.round((r.monthly||0)/2)-absAmt-lateAmt);days=pos(fac/24-abs-late/480);wd=days}
 else{wd=pos(+tm.days||0);basic=pos(Math.round((wd+leave)*daily)-lateAmt);days=pos(wd+leave-late/480)}
 let hol=0,ot=0,whol=0;
 const add=(k,label,hrs,pct)=>{hrs=pos(+hrs||0);if(!hrs||!pct)return;const a=Math.round(hrs*H*pct/100);if(k==='hol')hol+=a;else ot+=a;L.push({k,label,hrs,pct,amt:a})};

   else if(s==='worked'){whol++;const pct=x.rd?P.rhrd:P.rh;add('hol','Regular holiday worked'+(x.rd?' on rest day':'')+' ('+dl+')',x.h==null?8:x.h,mo?pct-100:pct);add('ot','Regular holiday overtime ('+dl+')',x.ot,x.rd?P.rhrdot:P.rhot)}
  }else if(s==='worked'){whol++;const pct=x.rd?P.sprd:P.sp;add('hol','Special day worked'+(x.rd?' on rest day':'')+' ('+dl+')',x.h==null?8:x.h,mo?pct-100:pct);add('ot','Special day overtime ('+dl+')',x.ot,x.rd?P.sprdot:P.spot)}
 });

function docHtml(inner,land,title,preview){
 return '<!doctype html><html><head><meta charset="utf-8"><title>'+esc(title||'Payroll')+'</title><style>'+(preview?'':'@page{size:A4 '+(land?'landscape':'portrait')+';margin:'+(land?'6mm':'0')+'}')+PRINT_CSS
  +(preview?'body{background:#c9d1dd;padding:14px}.page,.sheet{background:#fff;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.25)}.page{width:'+(land?'297mm':'210mm')+';min-height:'+(land?'190mm':'270mm')+'}':'')+'</style></head><body>'+inner+'</body></html>'}
function showPreview(el,inner,land,title){el.innerHTML='<iframe class="pv" title="Preview"></iframe>';el.firstChild.srcdoc=docHtml(inner,land,title,true)}
function printHtml(inner,land,title){
 const f=document.createElement('iframe');f.setAttribute('aria-hidden','true');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 const w=f.contentWindow,d=w.document;d.open();d.write(docHtml(inner,land,title));d.close();
 setTimeout(()=>{try{w.focus();w.print()}catch(e){toast('Printing is blocked here. Open the file in Chrome or Edge.','bad')}},300);setTimeout(()=>f.remove(),120000)}
// heading for a printout: the business, or for all businesses the group name from Settings › Company (never just one of the businesses)
const coName=(b,list)=>{if(b&&b!=='ALL')return b;if(DB.company.name)return DB.company.name;const L=(list||bizList()).filter(Boolean);return L.length===1?L[0]:L.length&&L.length<=3?L.join(' · '):'All businesses'};
const hd=(co,title,sub)=>'<div class="hd"><div class="co">'+esc(co)+'</div><div class="tt">'+esc(title)+'</div>'+(sub?'<div class="sb">'+esc(sub)+'</div>':'')+'</div>';

// ---------------------------------------------------------------- generic report table: screen, print and CSV from one definition
// cols: [{h,k,n(number in cents),d(days),w}], rows: objects; groupBy optional
function rptTable(def){
 const cols=def.cols,rows=def.rows,G=def.groupBy,tot={};
 const val=(c,r)=>typeof c.k==='function'?c.k(r):r[c.k];
 const cell=(c,v)=>c.n?m2(v):c.d?fN(v):esc(v==null?'':v);
 const sum=(L)=>{const t={};cols.forEach(c=>{if((c.n||c.d)&&!c.sumNo)t[c.h]=L.reduce((s,r)=>s+(+val(c,r)||0),0)});return t};
 const line=(r,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'>'+cols.map(c=>'<td class="'+(c.n||c.d?'n r':'')+'">'+cell(c,val(c,r))+'</td>').join('')+'</tr>';
 const LC=def.labelCol||0,totLine=(t,label,cls)=>'<tr class="'+cls+'">'+cols.map((c,i)=>'<td class="'+(c.n||c.d?'n r':'')+'">'+(i===LC?esc(label):c.sumNo?'':(c.n?m2(t[c.h]):c.d?fN(t[c.h]):''))+'</td>').join('')+'</tr>';
 let body='';
 if(G){const g=new Map();rows.forEach(r=>{const k=r[G]||'';if(!g.has(k))g.set(k,[]);g.get(k).push(r)});const multi=g.size>1;
  [...g.keys()].sort(cmp).forEach(k=>{const L=g.get(k);if(multi)body+='<tr class="g"><td colspan="'+cols.length+'">'+esc(k||'(no business)')+'</td></tr>';body+=L.map(r=>line(r)).join('');if(multi)body+=totLine(sum(L),'Subtotal – '+(k||'(no business)'),'st')})}
 else body=rows.map(r=>line(r)).join('');
 const T=sum(rows),hasTot=def.total!==false&&cols.some(c=>c.n||c.d);
 const thead='<tr>'+cols.map(c=>'<th class="'+(c.n||c.d?'n':'')+'">'+esc(c.h)+'</th>').join('')+'</tr>';
 const screen='<div class="tw"><table class="t"><thead>'+thead+'</thead><tbody>'+(body||'<tr><td colspan="'+cols.length+'" class="empty">'+esc(def.empty||'Nothing to show.')+'</td></tr>')+'</tbody>'+(hasTot&&rows.length?'<tfoot>'+totLine(T,'TOTAL ('+rows.length+')','gt')+'</tfoot>':'')+'</table></div>';
 const print='<table class="rt"><thead>'+thead+'</thead><tbody>'+body+(hasTot&&rows.length?totLine(T,'TOTAL ('+rows.length+')','gt'):'')+'</tbody></table>';
 const csv=()=>{const out=[];(def.csvHead||[]).forEach(h=>out.push(h));out.push(cols.map(c=>c.h));rows.forEach(r=>out.push(cols.map(c=>{const v=val(c,r);return c.n?p2(v):c.d?r4(+v||0):v==null?'':v})));if(hasTot&&rows.length)out.push(cols.map((c,i)=>i===LC?'TOTAL':c.sumNo?'':c.n?p2(T[c.h]):c.d?r4(T[c.h]):''));return toCsv(out)};
 return{screen,print,csv,T};
}

function combo(sel,ph){
 if(!sel||sel._cb)return sel;sel._cb=1;
 const w=document.createElement('div');w.className='cb';sel.parentNode.insertBefore(w,sel);w.appendChild(sel);
 sel.classList.add('cb-sel');sel.tabIndex=-1;sel.setAttribute('aria-hidden','true');
 const inp=document.createElement('input');inp.type='text';inp.autocomplete='off';inp.spellcheck=false;inp.placeholder=ph||'Type a name to search';
 inp.setAttribute('role','combobox');inp.setAttribute('aria-autocomplete','list');inp.setAttribute('aria-expanded','false');
 const lid='cbl'+uid();inp.setAttribute('aria-controls',lid);if(sel.id)inp.id=sel.id+'_q';
 const lab=sel.closest('.fg')&&$('label',sel.closest('.fg'));if(lab&&sel.id)lab.setAttribute('for',inp.id);
 const ls=document.createElement('div');ls.className='cb-list';ls.id=lid;ls.hidden=true;ls.setAttribute('role','listbox');
 w.append(inp,ls);
 let items=[],act=-1,typed=false;
 const curText=()=>{const o=sel.options[sel.selectedIndex];return o?o.text:''};
 const show=()=>{if(document.activeElement!==inp||!typed)inp.value=curText()};
 const paintAct=()=>{$$('[data-i]',ls).forEach(d=>{const on=+d.dataset.i===act;d.classList.toggle('on',on);d.setAttribute('aria-selected',on?'true':'false');if(on){inp.setAttribute('aria-activedescendant',d.id);d.scrollIntoView({block:'nearest'})}})};
 const open=all=>{const words=all?[]:inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  items=[...sel.options].filter(o=>{if(!o.text)return false;const t=o.text.toLowerCase();return words.every(x=>t.includes(x))});
  ls.innerHTML=items.slice(0,300).map((o,i)=>'<div role="option" id="'+lid+'_'+i+'" data-i="'+i+'">'+esc(o.text)+'</div>').join('')||'<div class="none">No match</div>';
  act=all?items.findIndex(o=>o.value===sel.value):(items.length?0:-1);ls.hidden=false;inp.setAttribute('aria-expanded','true');paintAct()};
 const close=()=>{ls.hidden=true;inp.setAttribute('aria-expanded','false');inp.removeAttribute('aria-activedescendant')};
 const pick=o=>{typed=false;close();if(!o){inp.value=curText();return}const ch=sel.value!==o.value;sel.value=o.value;inp.value=o.text;if(ch)sel.dispatchEvent(new Event('change',{bubbles:true}))};
 let fresh=false;
 inp.addEventListener('focus',()=>{typed=false;inp.select();fresh=true;open(true)});
 inp.addEventListener('mouseup',e=>{if(fresh){e.preventDefault();fresh=false}});
 inp.addEventListener('keydown',()=>{fresh=false},true);
 inp.addEventListener('click',()=>{if(ls.hidden)open(true)});
 inp.addEventListener('input',()=>{typed=true;open(false)});
 inp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(ls.hidden)return open(true);if(!items.length)return;act=e.key==='ArrowDown'?Math.min(items.length-1,act+1):Math.max(0,act-1);paintAct()}
  else if(e.key==='Enter'){if(!ls.hidden){e.preventDefault();e.stopPropagation();pick(items[act])}}
  else if(e.key==='Escape'){if(!ls.hidden){e.preventDefault();e.stopPropagation();typed=false;close();inp.value=curText()}}
  else if(e.key==='Tab'){if(!ls.hidden&&typed&&items[act])pick(items[act]);else close()}});
 inp.addEventListener('blur',()=>setTimeout(()=>{if(document.activeElement===inp)return;close();typed=false;inp.value=curText()},120));
 ls.addEventListener('mousedown',e=>{e.preventDefault();const d=e.target.closest('[data-i]');if(d)pick(items[+d.dataset.i])});
 sel.addEventListener('change',show);
 new MutationObserver(show).observe(sel,{childList:true,subtree:true});
 // keep the text in step when the code sets the value
 const D=Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
 Object.defineProperty(sel,'value',{configurable:true,get(){return D.get.call(sel)},set(v){D.set.call(sel,v);typed=false;inp.value=curText()}});
 sel._inp=inp;show();return sel}

 ytd(B){let y=new Date().getFullYear();const F=[['gross','Gross compensation'],['taxable','Taxable compensation'],['tax','Tax withheld'],['ben','13th month & benefits received (non-taxable part)'],['contAll','SSS, PhilHealth, Pag-IBIG (employee share)'],['basic13','Basic salary earned (for 13th month)'],['paid13','13th month already paid']];

 data(B){const age=backupAge();

   if(!d||!Array.isArray(d.employees)||!Array.isArray(d.runs))return toast('That file is not an AJ Payroll backup.','bad');

  $('#dClr').onclick=async()=>{if(!(await confirmBox('Delete <b>all</b> payroll data in this browser? This cannot be undone.','Delete everything',1)))return;DB=blank();save(true);brand();go('dash')};
